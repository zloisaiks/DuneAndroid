
name: Build Dune Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q DuneAndroid-project.zip
          test -f DuneAndroid/app/build.gradle

      - name: Build APK
        working-directory: DuneAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DuneAndroid-debug
          path: DuneAndroid/app/build/outputs/apk/debug/app-debug.apk
